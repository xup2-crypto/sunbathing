<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 3: Sunbathing - Teacher Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0d1117; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-bg { background-color: #161b22; border: 1px solid #21262d; }
    .inner-card { background-color: #0d1117; border: 1px solid #21262d; }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Top Unit Header -->
    <div class="card-bg rounded-2xl p-6 shadow-2xl flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="bg-amber-500/10 text-amber-400 p-3.5 rounded-xl text-3xl">
          <i class="fa-solid fa-sun"></i>
        </div>
        <div>
          <div class="flex flex-wrap items-center gap-3">
            <h1 class="text-2xl font-bold text-white tracking-tight">单元3: 晒太阳 <span class="text-gray-400 font-normal">/ Unit 3: Sunbathing</span></h1>
            <span class="text-xs font-semibold px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-full">
              班级: 5.3 / Class 5.3
            </span>
            <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 实时同步中 / Live Synced
            </span>
          </div>
          <p class="text-xs text-gray-400 mt-1">教师实时进度看板 & 模拟测试 / Teacher Dual Dashboard</p>
        </div>
      </div>

      <!-- Mode Switcher -->
      <div class="flex items-center gap-2">
        <button id="btnTeacherView" onclick="switchTab('teacher')" class="px-4 py-2 bg-amber-500 text-gray-950 font-bold text-xs rounded-xl shadow-lg transition flex items-center gap-2">
          <i class="fa-solid fa-chalkboard-user"></i> 教师看板 / Teacher View
        </button>
        <button id="btnStudentView" onclick="switchTab('student')" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-xs rounded-xl transition flex items-center gap-2">
          <i class="fa-solid fa-user-graduate"></i> 模拟学生体验 / Student Simulator
        </button>
      </div>
    </div>

    <!-- TAB 1: TEACHER DASHBOARD MATRIX -->
    <div id="tabTeacher" class="space-y-6">
      <div class="card-bg rounded-2xl p-6 shadow-xl flex flex-wrap items-center justify-between gap-4">
        <div>
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-users-rectangle text-amber-400"></i> 全班 30 位同学实时进阶矩阵
          </h2>
          <p class="text-xs text-gray-400 mt-0.5">监控 student.html 端打卡进度与获得勋章</p>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="generateRandomData()" class="px-3.5 py-2 bg-gray-800 hover:bg-gray-700 text-amber-400 text-xs font-bold rounded-xl border border-gray-700 transition flex items-center gap-1.5">
            <i class="fa-solid fa-wand-magic-sparkles"></i> 生成测试数据
          </button>
          <button onclick="clearAllData()" class="px-3.5 py-2 bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 text-xs font-bold rounded-xl border border-rose-800/50 transition flex items-center gap-1.5">
            <i class="fa-solid fa-trash"></i> 重置全班数据
          </button>
        </div>
      </div>

      <!-- 30 Students Matrix Grid -->
      <div id="teacherMatrixGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <!-- TAB 2: STUDENT SIMULATOR -->
    <div id="tabStudentSim" class="hidden space-y-6">
      <div class="card-bg rounded-2xl p-6 space-y-4 shadow-xl">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400 font-medium">老师切换模拟学生 / Simulating Student:</span>
            <select id="simStudentSelect" onchange="onSimStudentChange()" class="bg-gray-800 text-amber-400 font-bold text-xs px-3 py-2 rounded-xl border border-gray-700 focus:outline-none cursor-pointer">
              <!-- Populated dynamically -->
            </select>
          </div>
          <span class="text-xs text-amber-400 font-semibold">💡 老师可以在此体验学生打卡与勋章效果</span>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="card-bg rounded-2xl p-5 space-y-3">
          <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-pen-ruler text-amber-400"></i> Task 1: 做练习</h3>
          <div class="space-y-2">
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t1_mon')" id="tc_t1_mon"> 星期一练习</label>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t1_tue')" id="tc_t1_tue"> 星期二练习</label>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t1_wed')" id="tc_t1_wed"> 星期三练习</label>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t1_thu')" id="tc_t1_thu"> 星期四练习</label>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t1_fri')" id="tc_t1_fri"> 星期五练习</label>
          </div>
        </div>

        <div class="card-bg rounded-2xl p-5 space-y-3">
          <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-book-open text-amber-400"></i> Task 2: 阅读</h3>
          <div class="space-y-2">
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t2_1')" id="tc_t2_1"> 《太阳和彩虹》</label>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t2_2')" id="tc_t2_2"> 《太阳和北风》</label>
          </div>
        </div>

        <div class="card-bg rounded-2xl p-5 space-y-3">
          <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-feather text-amber-400"></i> Task 3: 仿写诗《晒太阳》</h3>
          <div class="space-y-2">
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t3_1')" id="tc_t3_1"> 《春风吹》</label>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t3_2')" id="tc_t3_2"> 《下雨了》</label>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t3_3')" id="tc_t3_3"> 《下雪了》</label>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t3_4')" id="tc_t3_4"> 《云儿飘》</label>
          </div>
        </div>

        <div class="card-bg rounded-2xl p-5 space-y-3">
          <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-brain text-amber-400"></i> Task 4: 读后感</h3>
          <div class="space-y-2">
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t4_1')" id="tc_t4_1"> 《太阳和彩虹》读后感</label>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"><input type="checkbox" onchange="toggleSimTask('t4_2')" id="tc_t4_2"> 《太阳和北风》读后感</label>
          </div>
        </div>

        <div class="card-bg rounded-2xl p-5 space-y-3 md:col-span-2">
          <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-stairs text-amber-400"></i> Task 5: 阶梯阅读 (1 - 10 阶)</h3>
          <div id="simT5Grid" class="grid grid-cols-2 sm:grid-cols-5 gap-2"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const TOTAL_TASKS = 23;
    const BADGES = {
      ex_master: { name: '练习达人', icon: '🏋️', bg: 'from-blue-600 to-indigo-800' },
      read_star: { name: '悦读之星', icon: '📖', bg: 'from-emerald-600 to-teal-800' },
      poet: { name: '诗意小作家', icon: '✍️', bg: 'from-purple-600 to-pink-800' },
      thinker: { name: '深度思考者', icon: '💡', bg: 'from-amber-500 to-orange-700' },
      step_master: { name: '阶梯阅读达人', icon: '🚀', bg: 'from-teal-600 to-cyan-800' },
      sun_champion: { name: '太阳全能王', icon: '☀️', bg: 'from-yellow-500 to-amber-600' }
    };

    const broadcast = new BroadcastChannel('class53_sync_channel');
    let activeSimStudent = '学生 01';

    function initSimT5() {
      const c = document.getElementById('simT5Grid');
      c.innerHTML = '';
      for(let i=1; i<=10; i++){
        c.innerHTML += `
          <label class="flex items-center gap-2 p-2.5 inner-card hover:border-gray-700 rounded-xl cursor-pointer transition">
            <input type="checkbox" onchange="toggleSimTask('t5_${i}')" id="tc_t5_${i}" class="w-3.5 h-3.5 text-amber-500 rounded bg-gray-900 border-gray-700 cursor-pointer">
            <span class="text-xs text-gray-200">第 ${i} 阶</span>
          </label>
        `;
      }
    }

    function initDropdown() {
      const sel = document.getElementById('simStudentSelect');
      sel.innerHTML = '';
      for (let i = 1; i <= 30; i++) {
        const num = i < 10 ? `0${i}` : `${i}`;
        const name = `学生 ${num}`;
        sel.innerHTML += `<option value="${name}">${name} (5.3)</option>`;
      }
      activeSimStudent = sel.value;
    }

    function getStore() {
      return JSON.parse(localStorage.getItem('unit3_class53_data') || '{}');
    }

    function saveStore(data) {
      localStorage.setItem('unit3_class53_data', JSON.stringify(data));
      broadcast.postMessage({ type: 'update' });
      render();
    }

    function calculateBadges(tasks) {
      let earned = [];
      const exCount = tasks.filter(t => t.startsWith('t1_')).length;
      if (exCount >= 3) earned.push(BADGES.ex_master);

      if (tasks.includes('t2_1') && tasks.includes('t2_2')) earned.push(BADGES.read_star);
      if (tasks.some(t => t.startsWith('t3_'))) earned.push(BADGES.poet);
      if (tasks.some(t => t.startsWith('t4_'))) earned.push(BADGES.thinker);

      const stepCount = tasks.filter(t => t.startsWith('t5_')).length;
      if (stepCount >= 5) earned.push(BADGES.step_master);

      if (exCount >= 3 && tasks.includes('t2_1') && tasks.some(t => t.startsWith('t3_')) && tasks.some(t => t.startsWith('t4_')) && stepCount >= 3) {
        earned.push(BADGES.sun_champion);
      }
      return earned;
    }

    function switchTab(tab) {
      const t = document.getElementById('tabTeacher');
      const s = document.getElementById('tabStudentSim');
      const tb = document.getElementById('btnTeacherView');
      const sb = document.getElementById('btnStudentView');

      if (tab === 'teacher') {
        t.classList.remove('hidden');
        s.classList.add('hidden');
        tb.className = "px-4 py-2 bg-amber-500 text-gray-950 font-bold text-xs rounded-xl shadow-lg transition flex items-center gap-2";
        sb.className = "px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-xs rounded-xl transition flex items-center gap-2";
      } else {
        t.classList.add('hidden');
        s.classList.remove('hidden');
        sb.className = "px-4 py-2 bg-amber-500 text-gray-950 font-bold text-xs rounded-xl shadow-lg transition flex items-center gap-2";
        tb.className = "px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-xs rounded-xl transition flex items-center gap-2";
      }
      render();
    }

    function onSimStudentChange() {
      activeSimStudent = document.getElementById('simStudentSelect').value;
      render();
    }

    function toggleSimTask(taskId) {
      const store = getStore();
      let tasks = store[activeSimStudent] || [];
      if (tasks.includes(taskId)) {
        tasks = tasks.filter(t => t !== taskId);
      } else {
        tasks.push(taskId);
      }
      store[activeSimStudent] = tasks;
      saveStore(store);
    }

    function render() {
      const store = getStore();

      const simTasks = store[activeSimStudent] || [];
      document.querySelectorAll('#tabStudentSim input[type="checkbox"]').forEach(cb => {
        const key = cb.id.replace('tc_', '');
        cb.checked = simTasks.includes(key);
      });

      const grid = document.getElementById('teacherMatrixGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= 30; i++) {
        const num = i < 10 ? `0${i}` : `${i}`;
        const name = `学生 ${num}`;
        const tasks = store[name] || [];
        const count = tasks.length;
        const pct = Math.round((count / TOTAL_TASKS) * 100);
        const badges = calculateBadges(tasks);

        let badgeHtml = '';
        if (badges.length === 0) {
          badgeHtml = `<span class="text-[10px] text-gray-500 italic">尚无勋章</span>`;
        } else {
          badges.forEach(b => {
            badgeHtml += `<span class="px-2 py-0.5 bg-gradient-to-r ${b.bg} text-white rounded-md text-[10px] font-bold shadow-sm">${b.icon} ${b.name}</span> `;
          });
        }

        grid.innerHTML += `
          <div class="card-bg rounded-2xl p-4 space-y-3 shadow-md border hover:border-gray-700 transition">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center font-bold text-xs border border-amber-500/30">
                  ${num}
                </div>
                <div>
                  <h4 class="font-bold text-white text-sm">${name}</h4>
                  <p class="text-[10px] text-gray-400">已完成 ${count} / ${TOTAL_TASKS} 项 (${pct}%)</p>
                </div>
              </div>
            </div>

            <div class="w-full bg-gray-900 rounded-full h-2 border border-gray-800 overflow-hidden">
              <div class="bg-amber-500 h-full rounded-full transition-all duration-300" style="width: ${pct}%"></div>
            </div>

            <div class="pt-1 flex flex-wrap gap-1">
              ${badgeHtml}
            </div>
          </div>
        `;
      }
    }

    function generateRandomData() {
      const demo = {};
      const pool = ['t1_mon', 't1_tue', 't1_wed', 't1_thu', 't1_fri', 't2_1', 't2_2', 't3_1', 't3_2', 't4_1', 't4_2', 't5_1', 't5_2', 't5_3', 't5_4', 't5_5'];
      for (let i = 1; i <= 30; i++) {
        const num = i < 10 ? `0${i}` : `${i}`;
        const name = `学生 ${num}`;
        const count = Math.floor(Math.random() * pool.length) + 1;
        demo[name] = pool.slice(0, count);
      }
      saveStore(demo);
    }

    function clearAllData() {
      if (confirm("确定要重置全班 30 位学生的打卡数据吗？")) {
        localStorage.removeItem('unit3_class53_data');
        saveStore({});
      }
    }

    broadcast.onmessage = (e) => { if (e.data.type === 'update') render(); };
    window.addEventListener('storage', () => render());

    initSimT5();
    initDropdown();
    render();
  </script>
</body>
</html>
